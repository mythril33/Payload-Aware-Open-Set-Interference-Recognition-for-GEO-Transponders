# B2 readiness CI: only dependency, safety-gate and small scientific/unit tests.
# This job MUST NOT generate the full B2 dataset, train production models, or upload raw data.
name: B2 readiness CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b2-readiness-ci.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "pyproject.toml"
      - "docs/plan/b2_readiness_gates_2026-10-21.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python unit and scientific tests (no production runs)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned xgboost-cpu 3.4.1 extra requires Python >=3.12.
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,xgb]"
      - name: Fail closed if any researcher gate is implicitly approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("docs/plan/b2_readiness_gates_2026-10-21.json").read_text())
          assert d["benchmark_complete"] is False
          assert d["decisions"]["K18"]["status"] == "PENDING_RESEARCHER"
          assert d["decisions"]["K17d"]["status"] == "PENDING_RESEARCHER"
          assert d["decisions"]["OBS-CANCEL-2"]["status"] == "PENDING_RESEARCHER"
          assert d["decisions"]["full_generation"]["status"] == "NOT_AUTHORIZED"
          assert d["decisions"]["full_gpu_training"]["status"] == "NOT_AUTHORIZED"
          assert d["decisions"]["full_loko_sweep"]["status"] == "NOT_AUTHORIZED"
          for name, decision in d["decisions"].items():
              assert decision.get("approval") is None, f"{name} carries an approval record"
          PY
      - name: Compile sources (syntax check)
        run: python -m compileall -q src tests scripts
      - name: E4 A5 plan-corruption checks (bounded, CPU only)
        run: |
          # Pure plan transformations, real-physics replay parity on one 8-scene test group generated inside
          # the test fixture (never the full dataset), receiver invariants, and the leakage/negative matrix on
          # deterministic stand-in physics. No model is trained for production and nothing is uploaded.
          python -m pytest -q tests/test_b2_a5_plan.py tests/test_b2_a5_replay.py tests/test_b2_a5_eval.py \
            tests/test_b2_a5_negative.py tests/test_b2_a5_resume.py tests/test_b2_a5_summary.py
      - name: Run repository tests on bounded CI runner
        run: |
          # The E4 A5 files already ran in the previous step; everything else (and any new test) runs here.
          python -m pytest -q --ignore=tests/test_b2_a5_plan.py --ignore=tests/test_b2_a5_replay.py \
            --ignore=tests/test_b2_a5_eval.py --ignore=tests/test_b2_a5_negative.py --ignore=tests/test_b2_a5_resume.py \
            --ignore=tests/test_b2_a5_summary.py
