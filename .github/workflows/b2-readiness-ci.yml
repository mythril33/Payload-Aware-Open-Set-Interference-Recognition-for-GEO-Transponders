# B2 readiness CI: only dependency, safety-gate and small scientific/unit tests.
# This job MUST NOT generate the full B2 dataset, train production models, or upload raw data.
name: B2 readiness CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/b2-readiness-ci.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "dashboard/**"
      - "pyproject.toml"
      - "docs/plan/b2_readiness_gates_2026-10-21.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python unit and scientific tests (no production runs)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The pinned xgboost-cpu 3.4.1 extra requires Python >=3.12.
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,xgb]"
          python -m pip install -r dashboard/requirements.txt
      - name: Verify explicit scientific approvals and keep all compute gates closed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path("docs/plan")
          gates = json.loads((root / "b2_readiness_gates_2026-10-21.json").read_text())
          memo = json.loads((root / "b2_e5_decision_recommendations.json").read_text())
          freeze = json.loads((root / "b2_e9_approved_scientific_protocol.json").read_text())
          assert gates["benchmark_complete"] is memo["benchmark_complete"] is freeze["benchmark_complete"] is False
          assert freeze["activation"] is False and freeze["production_authorized"] is False
          assert freeze["status"] == "SCIENTIFIC_PROTOCOL_APPROVED_NOT_EXECUTABLE"
          assert len(freeze["decisions"]) == 13
          for key, choice in {"K18": "A", "K17d": "A+C", "OBS-CANCEL-2": "A"}.items():
              gate, twin = gates["decisions"][key], memo["decisions"][key]
              assert gate["status"] == twin["status"] == "APPROVED"
              assert freeze["decisions"][key]["choice"] == choice
              record = gate["approval"]
              assert record["approved_by"] == twin["approved_by"] == freeze["approved_by"] == "mythril33"
              assert record["approved_at"] == twin["approved_at"] == freeze["approved_at"]
              datetime.fromisoformat(record["approved_at"].replace("Z", "+00:00"))
              assert isinstance(record["decision"], str) and record["decision"].strip()
              assert record["record"] == freeze["approval_record"]
              assert (Path(record["record"])).is_file()
          for key in ("full_generation", "full_gpu_training", "full_loko_sweep"):
              gate, twin = gates["decisions"][key], memo["decisions"][key]
              assert gate["status"] == twin["status"] == "NOT_AUTHORIZED"
              assert gate["approval"] is None
              assert twin["approved_by"] is None and twin["approved_at"] is None
          assert gates["decisions"]["merge_to_main"]["status"] == "NOT_AUTHORIZED_BY_THIS_PLAN"
          assert gates["decisions"]["merge_to_main"]["approval"] is None
          assert freeze["unresolved_operational_decisions"]["gpu_probe"] == "NOT_AUTHORIZED"
          assert freeze["unresolved_operational_decisions"]["production_launch"] == "DISABLED"
          candidate = json.loads((root / "b2_e8_candidate_production_config.json").read_text())
          assert candidate["approved"] is False and candidate["frozen"] is False
          assert candidate["status"] == "UNAPPROVED_NOT_FROZEN"
          assert all(x["status"] == "UNAPPROVED" for x in candidate["decision_recommendations"].values())
          assert freeze["parameter_records"]["precision_and_determinism"]["value"]["cudnn_allow_tf32"] is False
          assert freeze["parameter_records"]["precision_and_determinism"]["value"]["matmul_allow_tf32"] is False
          PY
      - name: Compile sources (syntax check)
        run: python -m compileall -q src tests scripts
      - name: E4 A5 plan-corruption checks (bounded, CPU only)
        run: |
          # Pure plan transformations, real-physics replay parity on one 8-scene test group generated inside
          # the test fixture (never the full dataset), receiver invariants, and the leakage/negative matrix on
          # deterministic stand-in physics. No model is trained for production and nothing is uploaded.
          python -m pytest -q -rs tests/test_b2_a5_plan.py tests/test_b2_a5_replay.py tests/test_b2_a5_eval.py \
            tests/test_b2_a5_negative.py tests/test_b2_a5_resume.py tests/test_b2_a5_summary.py
      - name: Run repository tests on bounded CI runner
        run: |
          # The E4 A5 files already ran in the previous step; everything else (and any new test) runs here.
          python -m pytest -q -rs --ignore=tests/test_b2_a5_plan.py --ignore=tests/test_b2_a5_replay.py \
            --ignore=tests/test_b2_a5_eval.py --ignore=tests/test_b2_a5_negative.py --ignore=tests/test_b2_a5_resume.py \
            --ignore=tests/test_b2_a5_summary.py
