   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="19.662416" y="19.481509" transform="rotate(-0 19.662416 19.481509)">Level</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="19.481509" transform="rotate(-0 41.938218 19.481509)">Observation at the monitor</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="19.481509" transform="rotate(-0 149.339406 19.481509)">What it can add (conditionally)</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: start" x="268.674059" y="19.481509" transform="rotate(-0 268.674059 19.481509)">Assumptions / remaining confounders</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="47.626867" transform="rotate(-0 26.026931 47.626867)">O1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="47.471242" transform="rotate(-0 41.938218 47.471242)">Band / total power</text>
   </g>
   <g id="text_7">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="47.457664" transform="rotate(-0 149.339406 47.457664)">gross level change, alarm</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3a2a1a" x="268.674059" y="47.402476" transform="rotate(-0 268.674059 47.402476)">cannot localize or separate mechanisms</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="76.181074" transform="rotate(-0 26.026931 76.181074)">O2</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="76.025449" transform="rotate(-0 41.938218 76.025449)">Co-polar PSD (averaged)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 72.931871)">spectral location and shape;</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 79.091871)">CW vs. wideband; IM regrowth shape</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 72.986683)">CuC nearly invisible at high C/I; IM vs.</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 78.926683)">coincident external energy ambiguous</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="104.735281" transform="rotate(-0 26.026931 104.735281)">O3</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="104.579656" transform="rotate(-0 41.938218 104.579656)">Spectrogram (time-resolved PSD)</text>
   </g>
   <g id="text_15">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="104.566078" transform="rotate(-0 149.339406 104.566078)">swept CW, pulsed / burst, on-off cycling</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 101.788531)">needs RBW, dwell and frame rate</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 107.48089)">matched to sweep or burst timing</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="133.289488" transform="rotate(-0 26.026931 133.289488)">O4</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="133.133863" transform="rotate(-0 41.938218 133.133863)">+ operator carrier plan</text>
   </g>
   <g id="text_19">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 130.040284)">planned vs. unplanned occupancy;</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 136.200284)">predicted IM product locations</text>
   </g>
   <g id="text_20">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 130.095097)">plan must be current and complete;</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 136.035097)">legitimate PCMA must be flagged</text>
   </g>
   <g id="text_21">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="161.843695" transform="rotate(-0 26.026931 161.843695)">O5</text>
   </g>
   <g id="text_22">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="161.68807" transform="rotate(-0 41.938218 161.68807)">+ cross-polar observation</text>
   </g>
   <g id="text_23">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 158.594491)">leakage consistency test</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 164.967554)">(co/cross correlation)</text>
   </g>
   <g id="text_24">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 158.649304)">synchronized, frequency-aligned receivers;</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 164.589304)">EP-U1 vs. EP-D coupling can remain confounded</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="190.397901" transform="rotate(-0 26.026931 190.397901)">O6</text>
   </g>
   <g id="text_26">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="190.242276" transform="rotate(-0 41.938218 190.242276)">Short IQ snapshots</text>
   </g>
   <g id="text_27">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="190.228698" transform="rotate(-0 149.339406 190.228698)">modulation and higher-order statistics</text>
   </g>
   <g id="text_28">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 187.203511)">short records limit cyclic resolution;</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 193.143511)">snapshots are not contiguous</text>
   </g>
   <g id="text_29">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="218.952108" transform="rotate(-0 26.026931 218.952108)">O7</text>
   </g>
   <g id="text_30">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="218.796483" transform="rotate(-0 41.938218 218.796483)">Contiguous IQ</text>
   </g>
   <g id="text_31">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="218.782905" transform="rotate(-0 149.339406 218.782905)">spectral correlation; hidden symbol rates</text>
   </g>
   <g id="text_32">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 215.757718)">longer records as the hidden carrier</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 221.697718)">weakens; cycle frequencies must differ</text>
   </g>
   <g id="text_33">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="247.506315" transform="rotate(-0 26.026931 247.506315)">O8</text>
   </g>
   <g id="text_34">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="247.35069" transform="rotate(-0 41.938218 247.35069)">+ host-carrier side information</text>
   </g>
   <g id="text_35">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'; text-anchor: start" x="149.339406" y="247.550175" transform="rotate(-0 149.339406 247.550175)">host cancellation residual (CuC)</text>
   </g>
   <g id="text_36">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 244.311925)">decodable host, known pulse shaping,</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 250.251925)">carrier and timing lock</text>
   </g>
   <g id="text_37">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="26.026931" y="276.060522" transform="rotate(-0 26.026931 276.060522)">O9</text>
   </g>
   <g id="text_38">
    <text style="font-size: 6px; font-family: 'DejaVu Sans'; text-anchor: start" x="41.938218" y="275.904897" transform="rotate(-0 41.938218 275.904897)">External evidence</text>
   </g>
   <g id="text_39">
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 272.811319)">source attribution: geolocation, CID,</text>
    <text style="font-size: 5.6px; font-family: 'DejaVu Sans'" transform="translate(149.339406 278.971319)">operator coordination</text>
   </g>
   <g id="text_40">
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 272.866131)">second satellite and ephemeris; cooperative</text>
    <text style="font-size: 5.4px; font-family: 'DejaVu Sans'; fill: #3a2a1a" transform="translate(268.674059 279.053772)">CID; administrative records</text>
   </g>
   <g id="text_41">
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'" transform="translate(95.188661 296.779282)">Left arrow: increasing data rate, side-information and synchronization requirements.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'" transform="translate(54.761911 303.020703)">Levels are not strictly nested: O4, O5, O8 and O9 are side channels whose availability is operator- and link-specific.</text>
    <text style="font-size: 5.2px; font-family: 'DejaVu Sans'" transform="translate(37.774973 309.262125)">An entry under ‘what it can add’ is a conditional possibility under the listed assumptions, not a demonstrated recognition result.</text>
   </g>
  </g>
 </g>
