   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="40.3272" y="34.211479" transform="rotate(-0 40.3272 34.211479)">D1  Mechanism</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(19.355013 61.996862)">CW, swept CW,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(11.389466 68.787643)">unauthorized carrier,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(13.621263 75.025416)">CuC, ASI, cross-pol,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(9.665989 81.515416)">payload IM, overdrive,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(20.525911 88.005416)">pulsed / burst,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(14.244309 94.495416)">broadband; benign</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(25.780989 101.518229)">look-alikes</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="120.6792" y="34.211479" transform="rotate(-0 120.6792 34.211479)">D2  Entry plane</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(91.365059 62.313541)">EP-U0 / EP-U1 / EP-P /</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(105.321739 68.767447)">EP-D / EP-R</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(95.634434 75.558229)">+ transformations</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(93.93545 81.515416)">experienced: IMUX,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(91.608263 88.172994)">TWTA AM/AM-AM/PM,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(90.01713 94.495416)">OMUX, depolarization,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(96.134161 100.985416)">receiver response</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="201.0312" y="34.211479" transform="rotate(-0 201.0312 34.211479)">D3  Observables</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(184.387684 61.996862)">power, PSD,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(171.075966 68.535416)">spectrogram, short or</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(167.308036 75.025416)">contiguous IQ, co / cross</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(174.118153 81.515416)">polarization, carrier</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(173.995262 88.005416)">plan, host side info,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(171.761747 94.747643)">cancellation residual,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(178.636747 101.518229)">calibration state</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="323.568" y="34.211479" transform="rotate(-0 323.568 34.211479)">D4  Identifiability (conditional)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(279.140891 59.052643)">Axis A, minimal observation set:</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(261.767336 65.290416)">A0 co-pol PSD/spectrogram; A1 + one added</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(255.429875 71.780416)">observation (P plan, X cross-pol, Q contiguous IQ,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(251.8755 78.270416)">H host residual, G geometry); A2 external evidence;</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(297.726164 85.293229)">A∅ none identified</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(255.552766 91.502643)">Axis B, dominant confounder: B-N nuisance level,</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(255.962688 97.740416)">B-P payload physics, B-I missing side information</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(274.17843 104.547096)">Evidence status: shown / not shown</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'DejaVu Sans'; text-anchor: middle" x="203.04" y="155.957719" transform="rotate(-0 203.04 155.957719)">D5  Strength of evidence (grades every link D1→D4)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(50.335078 178.062416)">E1 analytical derivation  ·  E2 standards reference model  ·  E3 controlled simulation  ·  E4 laboratory hardware</text>
    <text style="font-size: 5.5px; font-family: 'DejaVu Sans'" transform="translate(17.848125 184.552416)">E5 operational field measurement  ·  E6 secondary, vendor or unverified claim     (grades describe evidence type, not source prestige)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'DejaVu Sans'; text-anchor: middle" x="203.04" y="7.748352" transform="rotate(-0 203.04 7.748352)">Mechanism–Observation–Evidence (MOE) framework: a proposed synthesis device, not a validated algorithm</text>
   </g>
  </g>
 </g>
